name: CI

on:
  pull_request:
  push:

jobs:
  backend-offline:
    name: Backend offline checks
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://clerk-ci.invalid
      SUPABASE_ANON_KEY: test-anon-key-must-not-authenticate
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-must-not-authenticate
      SUPABASE_STORAGE_BUCKET: test-project-files
      DATABASE_URL: postgresql://clerk_ci:clerk_ci@127.0.0.1:9/application_database_must_not_be_contacted
      TEST_DATABASE_URL: postgresql://clerk_ci:clerk_ci@127.0.0.1:9/test_database_must_not_be_contacted
      ALLOW_DESTRUCTIVE_TEST_DATABASE: "0"
      OPENAI_API_KEY: test-openai-key-must-not-authenticate
      PUBLIC_APP_URL: http://clerk-ci.invalid
      ALLOWED_ORIGINS: http://clerk-ci.invalid
      BILLING_PROVIDER: none
      STRIPE_SECRET_KEY: test-stripe-key-must-not-authenticate
      STRIPE_WEBHOOK_SECRET: test-stripe-webhook-must-not-authenticate
      STRIPE_PRICE_ID: test-stripe-price
      AGENT_RUNTIME_ENABLED: "false"
      AGENT_PLATFORM_API_KEY: test-agent-platform-key-must-not-authenticate
      AGENT_TURN_TOKEN_SECRET: test-turn-token-secret-000000000000000000000000
      PI_BINARY_PATH: __clerk_ci_pi_must_not_execute__
      PI_MCP_ADAPTER_PATH: __clerk_ci_adapter_must_not_execute__
      AGENT_MCP_URL: http://127.0.0.1:9/mcp-must-not-be-contacted
      AGENT_WEB_RESEARCH_ENABLED: "false"
      WEB_SEARCH_PROVIDER: nsw_legislation
      BRAVE_SEARCH_API_KEY: test-brave-key-must-not-authenticate
      TENDER_WORKER_INPROC_ENABLED: "false"
      WORKFLOW_WORKER_INPROC_ENABLED: "false"
      DEPLOYMENT_ENVIRONMENT: test
      BUILD_SHA: test-build-sha
      AGENT_EXECUTION_SCOPE: test-agent
      WORKFLOW_QUEUE_SCOPE: test-workflow
      TENDER_QUEUE_SCOPE: test-tender
      STORAGE_CLEANUP_QUEUE_SCOPE: test-storage-cleanup
      PARSER_QUEUE_SCOPE: test-parser
      CLERK_TEST_ALLOW_NETWORK: "0"
      TENDER_LIVE_EVAL: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Lint backend
        working-directory: backend
        run: uv run ruff check app ingest tender tests
      - name: Run offline backend tests
        working-directory: backend
        run: uv run pytest -m "not integration and not tender_eval"
      - name: Verify migration graph
        working-directory: backend
        run: uv run pytest tests/tender/test_migrations.py -m "not integration"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm tsc --noEmit
      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint
      - name: Test frontend
        working-directory: frontend
        run: pnpm test
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  tender-seeds:
    name: Tender seed validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Validate tender seed data
        working-directory: backend
        run: uv run python ../data/tender/tools/validate.py
