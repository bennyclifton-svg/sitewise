[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clerk-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "greenlet>=3.2.4",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "openai>=2.41.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.106.0",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.50",
    "structlog>=26.1.0",
    "supabase>=2.31.0",
    "uvicorn>=0.49.0",
    "pymupdf==1.27.2.3",
    "mammoth==1.12.0",
    "tiktoken==0.13.0",
    "openpyxl==3.1.5",
    "jinja2==3.1.6",
    "markdown-it-py==4.2.0",
    "beautifulsoup4==4.15.0",
    "python-docx==1.2.0",
    "weasyprint==69.0",
    "pillow==12.2.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "opendataloader-pdf[hybrid]==2.4.7",
    "fastmcp==3.4.2",
    "stripe==15.3.0",
    "striprtf==0.0.32",
]

[tool.uv]
add-bounds = "exact"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest", "tender"]

[tool.pytest.ini_options]
addopts = "-m 'not integration and not tender_eval and not database_integration'"
markers = [
    "integration: network-eligible external-service test; still requires CLERK_TEST_ALLOW_NETWORK=1",
    "tender_eval: network-eligible Tender golden-set evaluation; still requires CLERK_TEST_ALLOW_NETWORK=1",
    "database_integration: destructive test against the exact disposable TEST_DATABASE_URL; requires DATABASE_INTEGRATION_TESTS=1",
]
