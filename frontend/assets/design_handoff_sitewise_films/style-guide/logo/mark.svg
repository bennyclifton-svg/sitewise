    <linearGradient id="sw-glass-lower" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3A80D2"></stop>
      <stop offset="1" stop-color="#1F5DAB"></stop>
    </linearGradient>

    
