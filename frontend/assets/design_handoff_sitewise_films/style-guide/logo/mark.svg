<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Sitewise">
  <title>Sitewise mark</title>
  <desc>Isometric projection of the Sitewise enclosure: graphite roof, bone floor, glazed face, open corner.</desc>
  <defs>
    <linearGradient id="sw-roof" x1="0.18" y1="0.05" x2="0.92" y2="0.95">
      <stop offset="0" stop-color="#454B55"></stop>
