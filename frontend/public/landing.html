<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="SiteWise — project evidence, workflow drafts, and grounded construction management."
    />
    <title>SiteWise</title>
    <link rel="icon" type="image/svg+xml" href="/style-guide/logo/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style-guide/tokens.css" />
    <link rel="stylesheet" href="/style-guide/light.css" />
    <link rel="stylesheet" href="/style-guide/motion.css" />
    <link rel="stylesheet" href="/landing-assets/landing.css" />
  </head>
  <body>
    <div class="sw-light-sun" aria-hidden="true"></div>
    <div class="sw-light-key" aria-hidden="true"></div>
    <div class="sw-light-vignette" aria-hidden="true"></div>
    <div class="sw-grain" aria-hidden="true"></div>
    <div class="sw-progress" aria-hidden="true"></div>

    <header class="sw-landing-nav">
      <a class="sw-landing-brand" href="/landing.html">
        <img
          src="/style-guide/logo/mark.svg"
          alt=""
          width="40"
          height="40"
          class="sw-landing-brand__mark"
        />
        <span class="sw-landing-brand__word">SiteWise</span>
      </a>
      <a class="sw-landing-nav__cta sw-transition" href="/login">Sign in</a>
    </header>

    <main>
      <section class="sw-landing-hero" id="hero">
        <div class="sw-landing-hero__copy sw-enter">
          <p class="sw-landing-label">Construction intelligence</p>
          <h1 class="sw-landing-display">
            Evidence in.<br />
            Decisions out.
          </h1>
          <p class="sw-landing-lede">
            Project workspaces, workflow drafts, and grounded chat for construction
            teams who need answers they can cite.
          </p>
          <div class="sw-landing-cta-row">
            <a class="sw-btn sw-btn--primary sw-transition" href="/login">Open SiteWise</a>
            <a class="sw-btn sw-btn--ghost sw-transition" href="/">Go to cockpit</a>
          </div>
        </div>

        <div class="sw-landing-hero__stage" aria-hidden="true">
          <canvas id="sw-mark-canvas" class="sw-landing-hero__canvas"></canvas>
          <img
            id="sw-mark-fallback"
            class="sw-landing-hero__fallback"
            src="/style-guide/logo/mark.svg"
            alt=""
            width="420"
            height="420"
            hidden
          />
        </div>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="/landing-assets/sitewise-hero.js"></script>
    <script type="module">
      let tx = innerWidth * 0.42,
        ty = innerHeight * 0.3,
        cx = tx,
        cy = ty;
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduced) {
        addEventListener(
          "pointermove",
          (e) => {
            tx = e.clientX;
            ty = e.clientY;
          },
          { passive: true },
        );
        (function tick() {
          cx += (tx - cx) * 0.055;
          cy += (ty - cy) * 0.055;
          document.documentElement.style.setProperty("--sw-key-x", cx.toFixed(1) + "px");
          document.documentElement.style.setProperty("--sw-key-y", cy.toFixed(1) + "px");
          requestAnimationFrame(tick);
        })();
      }
    </script>
  </body>
</html>
