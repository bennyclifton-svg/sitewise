      <stop offset="0.38" stop-color="#3A80D2"></stop>
      <stop offset="1" stop-color="#1C5AA3"></stop>
    </linearGradient>
    <linearGradient id="sw-glass-sheen" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"></stop>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"></stop>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <path d="M120 13.86 L211.92 66.93 L120 120 L28.08 66.93 Z" fill="url(#sw-roof)"></path>
  <path d="M120 120 L28.08 173.07 L120 226.14 Z" fill="url(#sw-floor)"></path>
