<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Sitewise">
  <title>Sitewise mark</title>
  <desc>Isometric enclosure: graphite roof, bone floor, glazed face, open corner. Light from the upper left.</desc>
  <defs>
    <linearGradient id="sw-roof" x1="0.12" y1="0.02" x2="0.88" y2="0.96">
      <stop offset="0" stop-color="#5A616A"></stop>
      <stop offset="0.42" stop-color="#32363D"></stop>
      <stop offset="1" stop-color="#1A1D22"></stop>
    </linearGradient>
    <linearGradient id="sw-floor" x1="0.08" y1="0.12" x2="0.9" y2="0.92">
      <stop offset="0" stop-color="#F4F3EE"></stop>
      <stop offset="1" stop-color="#C4C3BB"></stop>
    </linearGradient>
    <linearGradient id="sw-glass-upper" x1="0.18" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#2A5A96"></stop>
      <stop offset="0.45" stop-color="#123564"></stop>
      <stop offset="1" stop-color="#0A1F3E"></stop>
    </linearGradient>
    <linearGradient id="sw-glass-lower" x1="0.05" y1="0.05" x2="0.95" y2="0.95">
